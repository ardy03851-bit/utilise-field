<svg xmlns="http://www.w3.org/2000/svg" width="340" height="200" viewBox="0 0 340 200">
  <!-- pastel sky -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a8d8f0"/>
      <stop offset="1" stop-color="#fdf3e3"/>
    </linearGradient>
    <linearGradient id="scarf" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e86a6a"/>
      <stop offset="1" stop-color="#f2a65a"/>
    </linearGradient>
  </defs>
  <rect width="340" height="200" rx="18" fill="url(#sky)"/>
  <!-- ground -->
  <path d="M0 150 Q85 138 170 148 T340 146 L340 200 L0 200 Z" fill="#86b06a"/>
  <path d="M0 162 Q120 152 340 160 L340 200 L0 200 Z" fill="#a5cf85"/>
  <!-- clouds -->
  <g fill="#ffffff" opacity="0.9">
    <ellipse cx="70" cy="42" rx="26" ry="10">
      <animate attributeName="cx" values="70;92;70" dur="9s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="250" cy="30" rx="32" ry="11">
      <animate attributeName="cx" values="250;224;250" dur="11s" repeatCount="indefinite"/>
    </ellipse>
  </g>
  <!-- cube character (jelly squash) -->
  <g>
    <animateTransform attributeName="transform" type="scale" values="1 1; 1.06 0.92; 1 1; 0.97 1.04; 1 1"
      dur="2.2s" repeatCount="indefinite" additive="sum"/>
    <rect x="128" y="86" width="44" height="44" rx="10" fill="#f7e9d7" stroke="#4a3f36" stroke-width="3"/>
    <rect x="134" y="92" width="14" height="10" rx="5" fill="#ffffff" opacity="0.55"/>
    <!-- scarf attach -->
    <rect x="146" y="84" width="16" height="12" rx="5" fill="#e86a6a" stroke="#4a3f36" stroke-width="2.5"/>
  </g>
  <!-- flowing scarf ribbon -->
  <path fill="none" stroke="url(#scarf)" stroke-width="9" stroke-linecap="round"
    d="M150 92 Q168 90 186 96 T226 100">
    <animate attributeName="d"
      values="M150 92 Q168 86 186 96 T226 100;
              M150 92 Q168 98 186 90 T226 106;
              M150 92 Q168 86 186 96 T226 100"
      dur="1.6s" repeatCount="indefinite"/>
  </path>
  <!-- little weapon -->
  <g>
    <rect x="172" y="118" width="34" height="9" rx="4" fill="#efe3cf" stroke="#4a3f36" stroke-width="2.5"/>
    <rect x="204" y="117" width="9" height="11" rx="3" fill="#c47b4a" stroke="#4a3f36" stroke-width="2.5"/>
    <animateTransform attributeName="transform" type="rotate" values="0 172 122; 3 172 122; 0 172 122"
      dur="2.2s" repeatCount="indefinite"/>
  </g>
  <!-- grass tufts -->
  <g stroke="#6a9c4a" stroke-width="3" stroke-linecap="round" fill="none">
    <path d="M40 160 q2 -8 0 -12">
      <animateTransform attributeName="transform" type="rotate" values="-4 40 160; 5 40 160; -4 40 160" dur="2.8s" repeatCount="indefinite"/>
    </path>
    <path d="M300 158 q2 -8 0 -12">
      <animateTransform attributeName="transform" type="rotate" values="4 300 158; -6 300 158; 4 300 158" dur="3.4s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>
