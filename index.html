<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f3e9dc">
<title>utilise-field</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect x='15' y='15' width='70' height='70' rx='18' fill='%23f7b98b'/><path d='M50 15 q30 8 30 45 q-14 -10 -30 -4 q-16 6 -30 4 q0 -37 30 -45z' fill='%23e86a6a'/></svg>">
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #f3e9dc;
    touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
    font-family: ui-rounded, "SF Pro Rounded", "Segoe UI", system-ui, sans-serif; }
  #app { position: fixed; inset: 0; }
  canvas { display: block; }
  #boot { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 18px; color: #8a7460; background: #f3e9dc; z-index: 10;
    transition: opacity .6s ease; }
  #boot .cube { width: 54px; height: 54px; border-radius: 16px; background: #f7b98b;
    box-shadow: inset -8px -10px 0 rgba(0,0,0,.06); position: relative; animation: bob 1.4s ease-in-out infinite; }
  #boot .cube::after { content: ""; position: absolute; right: 38px; top: 4px; width: 26px; height: 44px;
    background: #e86a6a; border-radius: 12px 4px 14px 12px / 20px 4px 22px 20px; animation: flap 1.1s ease-in-out infinite; transform-origin: right center; }
  #boot .bar { width: 180px; height: 8px; border-radius: 4px; background: #e4d5c2; overflow: hidden; }
  #boot .bar i { display: block; height: 100%; width: 40%; border-radius: 4px; background: #e8a06b; animation: slide 1.2s ease-in-out infinite; }
  @keyframes bob { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-10px) } }
  @keyframes flap { 0%,100% { transform: rotate(8deg) skewY(4deg) } 50% { transform: rotate(-14deg) skewY(-6deg) } }
  @keyframes slide { 0% { transform: translateX(-160%) } 100% { transform: translateX(320%) } }
  #boot.hide { opacity: 0; pointer-events: none; }
</style>
</head>
<body>
<div id="app"></div>
<div id="boot"><div class="cube"></div><div class="bar"><i></i></div><div id="bootmsg">warming up…</div></div>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module" src="js/main.js"></script>
</body>
</html>
